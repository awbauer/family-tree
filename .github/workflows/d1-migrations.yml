# Apply D1 schema migrations (migrations/*.sql) to the production database.
#
# Runs on pushes to main that change migrations/, or by hand (Actions → D1 migrations → Run workflow).
# Cloudflare's own build (Workers Builds) deploys the Worker from the same push; its deploy step
# (tools/wait_migrations.mjs) waits until this workflow has applied any pending migrations, so new code
# never goes live ahead of its schema.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   API token with only "Account → D1 → Edit" for your account
#   CLOUDFLARE_ACCOUNT_ID  your account id
#   D1_DATABASE_ID         the family-tree D1 database id
# Optionally protect the "production" environment (Settings → Environments) to require approval first.
name: D1 migrations

on:
  push:
    branches: [main]
    paths: ["migrations/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check secrets
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID; do
            [ -n "${!v}" ] || { echo "::error::Missing repository secret $v"; exit 1; }
          done
      - name: Generate Wrangler config
        run: node tools/ci_config.mjs
      - name: Pending migrations
        run: npx wrangler d1 migrations list DB -c wrangler.ci.jsonc --remote
      - name: Apply migrations
        run: npx wrangler d1 migrations apply DB -c wrangler.ci.jsonc --remote
        env:
          CI: "true"
